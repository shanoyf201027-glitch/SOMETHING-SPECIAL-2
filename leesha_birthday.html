<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Leesha</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;min-height:100vh;color:#fff;overflow-x:hidden;
background:radial-gradient(circle at 20% 10%,#ff6fb5 0,transparent 40%),radial-gradient(circle at 85% 20%,#7b5cff 0,transparent 45%),linear-gradient(160deg,#2a0a4a,#5b1a6e 50%,#c2306f);background-attachment:fixed}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.balloon{position:absolute;bottom:-160px;width:60px;height:78px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:.85;animation:rise linear infinite}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,255,255,.5)}
@keyframes rise{to{transform:translateY(-130vh) rotate(8deg)}}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:28px 16px 60px;text-align:center}
.hb{font-family:'Great Vibes',cursive;font-size:clamp(40px,9vw,72px);line-height:1.1;text-shadow:0 4px 20px rgba(0,0,0,.35)}
.name{font-weight:700;font-size:clamp(44px,12vw,96px);letter-spacing:.12em;display:flex;justify-content:center;gap:.02em;margin:4px 0 6px}
.name span{display:inline-block;background:linear-gradient(180deg,#fff,#ffd6ec 50%,#ffc14d);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1.2s ease backwards,float 3s ease-in-out infinite}
@keyframes pop{0%{transform:translateY(-80px) scale(0);opacity:0}70%{transform:translateY(8px) scale(1.2)}100%{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
.avatar{width:150px;height:150px;border-radius:50%;margin:10px auto;border:5px solid #fff;background:#ffffff22 center/cover;display:none;box-shadow:0 0 0 6px #ffc14d88,0 10px 30px #0006}
.stage{margin:10px auto 0;max-width:520px}
svg{width:100%;height:auto;overflow:visible}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
button,label.btn{font:500 15px 'Poppins';border:0;border-radius:999px;padding:12px 22px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff4f9a,#ff8a3d);box-shadow:0 6px 18px #0004;transition:.2s}
button:hover,label.btn:hover{transform:translateY(-2px) scale(1.04)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.alt,label.btn.alt{background:linear-gradient(135deg,#7b5cff,#4fb4ff)}
.wish{min-height:150px;margin:14px auto;max-width:600px;background:#ffffff1c;backdrop-filter:blur(8px);border:1px solid #ffffff44;border-radius:22px;padding:20px 22px;font-size:17px;line-height:1.7;font-weight:300;display:none}
.wish b{font-family:'Great Vibes',cursive;font-size:34px;font-weight:400;display:block;margin-bottom:4px;color:#ffd6ec}
h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:44px;margin:30px 0 8px}
.frame{display:none;position:relative;margin:0 auto;width:min(340px,86vw);background:#fff;padding:12px 12px 46px;border-radius:6px;box-shadow:0 14px 40px #0007;transform:rotate(-2deg)}
.frame img{width:100%;height:min(440px,90vw);object-fit:cover;display:block;border-radius:3px;animation:fade .9s}
.frame p{position:absolute;bottom:10px;left:0;right:0;font-family:'Great Vibes',cursive;font-size:28px;color:#c2306f}
@keyframes fade{from{opacity:0;transform:scale(1.05)}}
.thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:10px;border:2px solid #fff8;cursor:pointer;transition:.2s}
.thumbs img.on{border-color:#ffc14d;transform:scale(1.15)}
.hint{font-size:13px;opacity:.75;margin-top:8px}
.flame{transform-origin:50% 100%;animation:flick .25s infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.smoke{opacity:0}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="balloons" id="balloons"></div>

<main>
  <div class="hb">Happy Birthday</div>
  <div class="name" id="name"></div>
  <div class="avatar" id="avatar"></div>

  <div class="stage">
    <svg viewBox="0 0 400 300" id="cakeSvg">
      <defs>
        <clipPath id="cMain"><rect x="0" y="0" width="262" height="300"/></clipPath>
        <clipPath id="cSlice"><rect x="262" y="0" width="140" height="300"/></clipPath>
        <linearGradient id="choc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3b22"/><stop offset="1" stop-color="#4a2013"/></linearGradient>
        <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3e4"/><stop offset="1" stop-color="#f3d9bd"/></linearGradient>
        <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8cbf"/><stop offset="1" stop-color="#f0569a"/></linearGradient>
        <g id="cake">
          <rect x="60" y="175" width="280" height="68" rx="8" fill="url(#choc)"/>
          <rect x="60" y="138" width="280" height="37" fill="url(#cream)"/>
          <rect x="60" y="170" width="280" height="8" fill="#ff8cbf"/>
          <rect x="60" y="100" width="280" height="38" rx="10" fill="url(#ice)"/>
          <g fill="#ff8cbf">
            <path d="M60 130 q10 28 20 0 q10 34 22 0 q10 24 20 0 q10 36 22 0 q10 26 20 0 q10 32 22 0 q10 28 20 0 q10 34 22 0 q10 26 20 0 q10 30 22 0 q10 28 20 0 q10 34 22 0 q10 24 20 0 V100 H60Z"/>
          </g>
          <g fill="#fff"><circle cx="90" cy="112" r="5"/><circle cx="140" cy="116" r="5"/><circle cx="190" cy="112" r="5"/><circle cx="240" cy="116" r="5"/><circle cx="290" cy="112" r="5"/><circle cx="320" cy="114" r="4"/></g>
          <g fill="#c2182b"><circle cx="115" cy="104" r="6"/><circle cx="215" cy="104" r="6"/><circle cx="315" cy="104" r="6"/></g>
        </g>
      </defs>
      <ellipse cx="200" cy="252" rx="185" ry="18" fill="#00000040"/>
      <ellipse cx="200" cy="244" rx="175" ry="16" fill="#fff"/>
      <ellipse cx="200" cy="241" rx="160" ry="11" fill="#f1e7ff"/>

      <use href="#cake" clip-path="url(#cMain)"/>
      <g id="slice"><use href="#cake" clip-path="url(#cSlice)"/>
        <rect id="cutFace" x="260" y="100" width="3" height="143" fill="#0003" opacity="0"/>
      </g>

      <g id="candles">
        <g class="cd" transform="translate(100 0)"></g>
      </g>

      <g id="knife" transform="translate(262 -150)" opacity="0">
        <rect x="-2" y="40" width="4" height="120" fill="#e8eef5"/>
        <path d="M-3 40 L3 40 L3 150 L0 160 L-3 150Z" fill="#cfd8e3"/>
        <rect x="-8" y="10" width="16" height="32" rx="6" fill="#6b3f2a"/>
      </g>
      <text id="sliceTxt" x="300" y="228" text-anchor="middle" font-family="Great Vibes" font-size="26" fill="#fff" opacity="0">Yum!</text>
    </svg>
    <div class="btns">
      <button id="bStart">🎵 Start the Party</button>
      <button id="bBlow" class="alt" disabled>🕯️ Blow the Candles</button>
      <button id="bCut" disabled>🔪 Cut the Cake</button>
    </div>
  </div>

  <div class="wish" id="wish"><b>Dear Leesha,</b><span id="wishTxt"></span></div>

  <h2>Memories of Leesha 📸</h2>
  <label class="btn alt" for="pics">➕ Add Leesha's Photos</label>
  <input type="file" id="pics" accept="image/*" multiple hidden>
  <p class="hint">Pick your photos from this device and they will appear in the slideshow. They stay on your device only.</p>
  <div style="height:16px"></div>
  <div class="frame" id="frame"><img id="big" alt="Leesha"><p>Leesha ✨</p></div>
  <div class="thumbs" id="thumbs"></div>
</main>

<script>
const NAME="LEESHA";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// Name letters
[...NAME].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(i*.12)+'s, '+(1.2+i*.2)+'s';$('name').appendChild(s)});

// Balloons
const cols=['#ff4f9a','#ffc14d','#4fb4ff','#7b5cff','#53e0a5','#ff7a59'];
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='balloon';
 b.style.left=Math.random()*96+'%';b.style.background=`radial-gradient(circle at 30% 30%,#fff9,${cols[i%6]} 55%)`;
 b.style.animationDuration=(9+Math.random()*9)+'s';b.style.animationDelay=(-Math.random()*14)+'s';
 b.style.transform=`scale(${.7+Math.random()*.7})`;$('balloons').appendChild(b)}

// Candles
const cx=[95,135,175,215,245], cc=['#ff4f9a','#4fb4ff','#ffc14d','#53e0a5','#a78bfa'];
const cg=$('candles');cg.innerHTML='';
cx.forEach((x,i)=>{
 cg.insertAdjacentHTML('beforeend',`<g class="cn" transform="translate(${x} 0)">
  <rect x="-4" y="68" width="8" height="34" rx="2" fill="${cc[i]}"/>
  <rect x="-4" y="76" width="8" height="4" fill="#fff6"/><rect x="-4" y="86" width="8" height="4" fill="#fff6"/>
  <line x1="0" y1="68" x2="0" y2="62" stroke="#333" stroke-width="1.5"/>
  <g class="flame"><ellipse cx="0" cy="54" rx="6" ry="10" fill="#ff9d2e"/><ellipse cx="0" cy="56" rx="3.2" ry="6" fill="#fff3a0"/></g>
  <circle class="smoke" cx="0" cy="55" r="3" fill="#ccc"/>
 </g>`)});

// Confetti
const cv=$('fx'),ctx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(n=140,x=innerWidth/2,y=innerHeight/3){
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
 P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.18,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],life:140+Math.random()*80})}}
function rain(){for(let i=0;i<4;i++)P.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.02,w:7,h:5,r:0,vr:.2,c:cols[(Math.random()*6)|0],life:300})}
let rainOn=false;
(function loop(){ctx.clearRect(0,0,cv.width,cv.height);if(rainOn)rain();
 P=P.filter(p=>p.life-->0);P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
 requestAnimationFrame(loop)})();

// Music: Happy Birthday tune (traditional)
let ac,playing=false;
function tune(){
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const f={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
 const seq=[['G4',.5],['G4',.5],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.5],['G4',.5],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.5],['G4',.5],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.5],['F5',.5],['E5',1],['C5',1],['D5',1],['C5',2]];
 let t=ac.currentTime+.05;
 seq.forEach(([n,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f[n];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*.42);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d*.45);t+=d*.45});
}

// Wish typing
const WISH=`Happy Birthday, Leesha! 🎂✨ May this new year of your life be filled with endless smiles, wonderful adventures and dreams that come true. You light up every place you walk into, whether it is a tea garden, a palace garden or a quiet old church square. Stay as kind, graceful and joyful as you are. Wishing you love, laughter, success and all the sweetness of this cake, today and always! 💖🎉`;
async function typeWish(){$('wish').style.display='block';const el=$('wishTxt');el.textContent=' ';
 for(const ch of WISH){el.textContent+=ch;await sleep(28)}}

// Buttons / sequence
$('bStart').onclick=()=>{$('bStart').disabled=true;burst(160);tune();$('bBlow').disabled=false};
$('bBlow').onclick=async()=>{
 $('bBlow').disabled=true;
 document.querySelectorAll('.cn').forEach((c,i)=>setTimeout(()=>{
  c.querySelector('.flame').style.display='none';
  c.querySelector('.smoke').animate([{opacity:.8,transform:'translateY(0)'},{opacity:0,transform:'translateY(-30px)'}],{duration:1400,fill:'forwards'});
 },i*220));
 await sleep(1500);burst(220);$('bCut').disabled=false;
};
$('bCut').onclick=async()=>{
 $('bCut').disabled=true;
 const knife=$('knife'),slice=$('slice');
 knife.setAttribute('opacity',1);
 await knife.animate([{transform:'translate(262px,-150px)'},{transform:'translate(262px,90px)'}],{duration:1400,easing:'ease-in',fill:'forwards'}).finished;
 $('cutFace').setAttribute('opacity',1);
 await sleep(250);
 knife.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'});
 slice.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate(30px,6px) rotate(2deg)'},{transform:'translate(52px,12px) rotate(4deg)'}],{duration:1400,easing:'ease-out',fill:'forwards'});
 await sleep(1300);
 $('sliceTxt').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:800,fill:'forwards'});
 burst(260,innerWidth/2,innerHeight/2);rainOn=true;
 typeWish();
 setTimeout(()=>rainOn=false,9000);
};

// Photos
let imgs=[],cur=0,timer;
$('pics').onchange=e=>{
 imgs=[...e.target.files].map(f=>URL.createObjectURL(f));
 if(!imgs.length)return;
 $('avatar').style.display='block';$('avatar').style.backgroundImage=`url(${imgs[0]})`;
 $('frame').style.display='block';
 $('thumbs').innerHTML='';
 imgs.forEach((u,i)=>{const t=document.createElement('img');t.src=u;t.onclick=()=>show(i,true);$('thumbs').appendChild(t)});
 show(0);burst(100);
};
function show(i,manual){
 cur=i;const big=$('big');big.style.animation='none';void big.offsetWidth;big.style.animation='';big.src=imgs[i];
 [...$('thumbs').children].forEach((t,k)=>t.classList.toggle('on',k===i));
 clearInterval(timer);timer=setInterval(()=>show((cur+1)%imgs.length),3200);
}
</script>
</body>
</html>
